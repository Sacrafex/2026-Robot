<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: #000;
  font-family: Verdana, sans-serif;
  overflow: hidden;
}

@keyframes changeColor{
  
  0%{
    filter: hue-rotate(0deg) blur(6px)
  }
   100%{
    filter: hue-rotate(360deg) blur(6px)
  }
  
}

.wrapper {
  position: relative;
  width: 100%;
}

.background {
  position: absolute;
  inset: 0;
  z-index: 1;
  align-items: center;
  justify-content: center;
  animation: changeColor 10s linear infinite;
  filter: blur(6px);
}

.overlay {
  position: relative;
  inset: 0;
  z-index: 2;
  color: white;
  padding: 24px;
  flex: 1;
  margin: 10px;
  display: flex;
  flex-direction: column;
}

svg {
  display: block;
  font: 20em 'Montserrat';
  width: 80%;
  height: 300px;
  margin-top:140px;
}

.text-copy {
  fill: none;
  stroke: white;
  stroke-dasharray: 6% 29%;
  stroke-width: 5px;
  animation: stroke-offset 5.5s infinite linear;
}

.text-copy:nth-child(1) {
  stroke: #FFD700;
  animation-delay: -1s;
}

.text-copy:nth-child(2) {
  stroke: #847900;
  animation-delay: -2s;
}

.text-copy:nth-child(3) {
  stroke: #DAA520;
  animation-delay: -3s;
}

.text-copy:nth-child(4) {
  stroke: #FF8C00;
  animation-delay: -4s;
}

@keyframes stroke-offset {
  100% {
    stroke-dashoffset: -35%;
  }
}
.bar {
  width: 80%;
  height: 12px;
  min-height: 12px;
  background: #2222226e;
  border: 1px solid #555;
  border-radius: 4px;
  overflow: hidden;
  margin: 6px 0 14px;
}

.bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #FFD700, #FF8C00);
  transition: width 0.1s linear;
  position: relative;
  font-size: 10px;

}
.bar-fill::after {
  content: attr(data-label);
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 10px;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
}
.ac {
    width: 100%;
    height: 30px;
    min-height: 10px;
    background: #2222226e;
    border: 1px solid #555;
    border-radius: 4px;
    overflow: hidden;
    margin: 6px 0 14px;
    color: white;
}
input[type="number"] {
    width: 100%;
    height: 30px;
    min-height: 10px;
    background: #2222226e;
    border: 1px solid #555;
    border-radius: 4px;
    overflow: hidden;
    margin: 6px 0 14px;
    color: white;
}

.sliderA {
  accent-color: #ebebeb4a;
  width: 100%;
  height: 30px;
  min-height: 10px;
  background: #2222226e;
  border: 1px solid #555;
  border-radius: 4px;
  overflow: hidden;
  color: white;
}

button {
    width: 100%;
    height: 30px;
    min-height: 10px;
    background: #2222226e;
    border: 1px solid #555;
    border-radius: 4px;
    overflow: hidden;
    margin: 6px 0 14px;
    color: white;
}
.tptext {
  font-weight: 200;
  color:rgba(255, 255, 255, 0.54);
  text-align: center;
}
.large {
  font-weight: 400;
  font-size: 20px;
  color:rgba(255, 255, 255, 0.733);
}
canvas {
  aspect-ratio: 1/1;
  width:90%;
  margin-top:20%;
}
input::placeholder {
  text-align: center;
}
select option {
  background-color: #000;
}
#slider-container {
    display: flex;
    gap: 12px;
}
.slider-box {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    color: #fff;
}
.sliderB {
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
    writing-mode: bt-lr;
    width: 20px;
    accent-color: #ebebeb4a;
    height: 400px;
}
.value {
    font-size: 12px;
}
</style>
</head>

<script>
const limits = {
  TargetSpeed: 6000,
  BeltSpeed: 6000,
  KickSpeed: 6000,
  ShooterSpeed: 6000,
  IntakeRoller: 6000,
  HopperDistance: 20
};

async function updateDashboard() {
    try {
        const res = await fetch('/data');
        const dataDB = await res.json();

        for (const key in dataDB) {
            const valueEl = document.getElementById(key);
            if (valueEl) valueEl.innerText = dataDB[key];

            const bar = document.getElementById(key);
            if (bar && limits[key] !== undefined) {
                const percent = Math.min((dataDB[key] / limits[key]) * 100, 100);
                bar.style.width = percent + "%";
            }
        }

        const distance = dataDB.distance;
        const sliders = document.querySelectorAll('.sliderB');
        let closestSlider = null;
        let closestDiff = Infinity;

        sliders.forEach(slider => {
            const sliderValue = parseFloat(slider.value);
            const diff = Math.abs(sliderValue - distance);
            if (diff < closestDiff) {
                closestDiff = diff;
                closestSlider = slider;
            }
            slider.style.backgroundColor = "";
        });

        if (closestSlider) {
            closestSlider.style.backgroundColor = "rgba(255, 0, 0, 0.5)";
        }

        document.getElementById("status").innerHTML = '<p style="color:lightgreen;">Connected</p> ' + new Date().toLocaleTimeString();
    } catch (err) {
        console.log("Caught Error: " + err);
        document.getElementById("status").innerHTML = '<p style="color:red;">Disconnected</p> ';
    }
}

async function updateAutoChooser() {
    try {
        const resautos = await fetch('/autos');
        const data = await resautos.json();
        const select = document.getElementById('autoChooser');
        select.innerHTML = '';
        for (const [name, val] of Object.entries(data.options)) {
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = name;
            opt.style.backgroundColor = "#000";
            if (val === data.selected) opt.selected = true;
            select.appendChild(opt);
        }
    } catch (err) {
        console.error('Failed to load autos', err);
    }
}

async function fetchSpeeds() {
    try {
        const res = await fetch('/speeds');
        const speeds = await res.json();
        const sliders = document.querySelectorAll('.sliderB');
        sliders.forEach((slider, index) => {
            if (index < speeds.length) {
                slider.value = speeds[index];
                slider.previousElementSibling.textContent = (speeds[index] / 1000).toFixed(1) + 'k';
            }
        });
    } catch (err) {
        console.error('Failed to fetch speeds:', err);
    }
}

document.getElementById('autoChooser').addEventListener('change', e => {
    fetch('/setAuto?auto=' + e.target.value);
});

async function runObjectForTime(target, value, time) {
  try {
  await fetch(`/set?target=${encodeURIComponent(target)}&value=${encodeURIComponent(value)}&time=${encodeURIComponent(time)}`);
  } catch (err) {
  console.log(err);
  }
}

async function setRobotRotation() {
  request = await fetch("/rotations");
  if (!request.ok) {return}
  datarot = await request.json();
  document.getElementById("robotBase").style.transform = `rotate(${datarot.degree}deg)`;
}

async function applyPIDs() {
  const targetChooser = document.getElementById("targetChooser");
  const elP = document.getElementById("kP");
  const elI = document.getElementById("kI");
  const elD = document.getElementById("kD");
  var target;

  try {
    const params = new URLSearchParams({
      kPvar: elP.value,
      kIvar: elI.value,
      kDvar: elD.value,
      target: targetChooser.value
    });
    await fetch(`/setPID?${params.toString()}`);
  } catch (err) {
    console.log("Failed to set PIDs:", err);
  }
}

async function loadPIDs() {
    const targetChooser = document.getElementById("targetChooser");
    const elP = document.getElementById("kP");
    const elI = document.getElementById("kI");
    const elD = document.getElementById("kD");
    var target;
    
    try {
    const response2 = await fetch("/requestpid?target="+targetChooser.value);
    if (!response2.ok) return;
    
    const data2 = await response2.json();
    console.log(data2);
    elP.value = data2.kP;
    elI.value = data2.kI;
    elD.value = data2.kD;
  } catch (err) {
    console.error("Failed to fetch default PIDs:", err);
    return;
  }
}

function updateAll() {
  updateDashboard();
  setRobotRotation();
  updateAutoChooser();
}

document.getElementById('targetChooser').addEventListener('change', e => {
    loadPIDs();
});

document.getElementById('ec').addEventListener('change', e => {
    fetch('/setErrorCorrection?value=' + e.target.value);
});

window.addEventListener('load', (event) => {
    loadPIDs();
    fetchSpeeds();
});

setInterval(updateAll, 100);

const sliders = document.querySelectorAll('input[type=range]');
  sliders.forEach(slider => {
    const valueDiv = slider.previousElementSibling;
    slider.addEventListener('input', () => {
      valueDiv.textContent = (slider.value / 1000).toFixed(1) + 'k';
  });
});

const verticalSliders = document.querySelectorAll('.sliderB');

verticalSliders.forEach((slider, index) => {
  slider.addEventListener('input', async (event) => {
    const speed = event.target.value;
    try {
      await fetch(`/updateSpeeds?index=${index}&speed=${speed}`);
      fetchSpeeds();
    } catch (err) {
      console.error('Failed to update speed:', err);
    }
  });
});
</script>
